<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>克拉肯近戰與命中水花檢查</title><style>body{margin:0;background:#6fa9ae;color:white;font:15px system-ui}p{position:fixed;top:12px;left:22px;pointer-events:none}</style><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script><p id="status">赤潮克拉肯 · 實戰尺寸與水線 · 拖曳環視 / 滾輪縮放</p><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {WaterImpactPool} from './water-impact-pool.js';import {stepKrakenCombat} from './kraken-combat.js';import {createGameKraken} from './game-kraken.js';import {createShip} from '../ship-preview/ship.js';import {createOcean} from '../ship-preview/ocean.js';

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,240);camera.position.set(20,14,24);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.maxPolarAngle=Math.PI*.48;controls.update();

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 const result=stepKrakenCombat(target,player,time);if(result.engaged&&!result.locked){target.yaw=result.heading;target.x+=Math.cos(target.yaw)*result.speed*dt;target.z-=Math.sin(target.yaw)*result.speed*dt;}
 monster.group.position.x=target.x;monster.group.position.z=target.z;monster.group.rotation.y=target.yaw;monster.animate(time,result.age);
 if(result.strike){water.spawn(result.hit?player.x:target.x+8,0,0);if(result.hit){hits++;hitAt=time;}}
