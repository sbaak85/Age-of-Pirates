 <header><small>AGE OF PIRATES / GEOMETRY COMPARISON</small><h1>獸骨造型 · 減面比較</h1>
  <div class="toolbar">
   <div class="views" role="group" aria-label="觀察角度"><button data-view="hero" aria-pressed="true">主視角</button><button data-view="side" aria-pressed="false">側面</button><button data-view="front" aria-pressed="false">正面</button><button data-view="game" aria-pressed="false">俯視角</button><button data-view="top" aria-pressed="false">頭頂輪廓</button></div>
   <div class="separator"></div><label>獸骨尺寸 <input id="scale" type="range" min="60" max="100" step="5" value="80" aria-label="獸骨尺寸百分比"><output id="scale-value" for="scale">80%</output></label>
   <label><input id="skull-profile" type="checkbox" checked>加寬頭型</label><label><input id="studio" type="checkbox">純骨骼</label><label><input id="wireframe" type="checkbox">線框</label><label><input id="rotate" type="checkbox">自動旋轉</label><button id="reset">重設比較</button>
  </div>
  <p class="help">拖曳任一側同步旋轉 · 滾輪同步縮放 · 右鍵平移 ｜ 兩版長、寬、高均為先前的 80%，船隻尺寸固定；可用滑桿微調。</p>
 </header>
 <main><section class="panel" aria-label="原版模型"><div class="caption"><span>ORIGINAL / A</span><h2>原版造型</h2><div id="original-count" class="stats">載入面數…</div></div><div id="original-viewport" class="canvas"></div><div class="corner">相同光照 · 相同材質 · 同步鏡頭</div></section>
 <section class="panel" aria-label="減面模型"><div class="caption"><span>LOD 50 / B</span><h2>減面 50% 版</h2><div id="reduced-count" class="stats">載入面數…</div></div><div class="corner ratio" id="reduction">正在核對面數…</div><div id="reduced-viewport" class="canvas"></div></section></main>
 <footer><span>三角面數僅計算完整獸骨；植被、島地與船隻在兩邊保持一致。</span><a href="./beast-skull-preview.html" target="_blank" rel="noopener">開啟先前預覽 ↗</a></footer>

</body>
